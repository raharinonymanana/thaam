AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Thaam - a companion for online-fraud victims in India.
  Layers 1-3b: storage (S3, DynamoDB) + API (HTTP API, create_case, extract, plan and audio Lambdas).

Parameters:
  ScreenshotRetentionDays:
    Type: Number
    Default: 7
    Description: Days before an uploaded screenshot is deleted automatically.
  CasePackRetentionDays:
    Type: Number
    Default: 90
    Description: Days before a generated case pack (PDF, letter) is deleted automatically.

Globals:
  Function:
    Runtime: python3.14
    Architectures: [x86_64]
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref CasesTable
        BUCKET_NAME: !Ref EvidenceBucket

Resources:
  # ------------------------------------------------------------------
  # S3: private, encrypted, TLS-only, self-deleting evidence storage
  # ------------------------------------------------------------------
  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      # No BucketName: CloudFormation generates a globally unique one.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: DeleteScreenshots
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: !Ref ScreenshotRetentionDays
          - Id: DeleteCasePacks
            Status: Enabled
            Prefix: packs/
            ExpirationInDays: !Ref CasePackRetentionDays
          - Id: CleanUpFailedUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          # Browser uploads go straight to S3 with a presigned URL.
          # TODO (Fri): restrict AllowedOrigins to the Amplify domain.
          - AllowedMethods: [PUT, GET, POST]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub "${EvidenceBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ------------------------------------------------------------------
  # DynamoDB: one item per case, expires automatically via TTL
  # ------------------------------------------------------------------
  CasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: caseId
          AttributeType: S
      KeySchema:
        - AttributeName: caseId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      # Encrypted at rest by default (AWS-owned key, no extra cost).
      # Point-in-time recovery deliberately OFF: backups would keep
      # personal data alive after the 90-day deletion promise.

  # ------------------------------------------------------------------
  # API: HTTP API with two routes, throttled
  # ------------------------------------------------------------------
  ThaamApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        # TODO (Fri): restrict AllowOrigins to the Amplify domain.
        AllowOrigins: ["*"]
        AllowMethods: [POST, GET, OPTIONS]
        AllowHeaders: [content-type]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  # ------------------------------------------------------------------
  # Lambda: POST /cases -> store consent, return presigned upload form
  # ------------------------------------------------------------------
  CreateCaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: handlers.create_case.lambda_handler
      Timeout: 5
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt CasesTable.Arn
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${EvidenceBucket.Arn}/uploads/*"
      Events:
        CreateCase:
          Type: HttpApi
          Properties:
            ApiId: !Ref ThaamApi
            Method: POST
            Path: /cases

  CreateCaseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CreateCaseFunction}"
      RetentionInDays: 14

  # ------------------------------------------------------------------
  # Lambda: POST /cases/{caseId}/extract -> Textract + SMS parser
  # ------------------------------------------------------------------
  ExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: handlers.extract.lambda_handler
      Timeout: 15
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt CasesTable.Arn
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${EvidenceBucket.Arn}/uploads/*"
            - Effect: Allow
              Action: textract:DetectDocumentText
              Resource: "*"
      Events:
        Extract:
          Type: HttpApi
          Properties:
            ApiId: !Ref ThaamApi
            Method: POST
            Path: /cases/{caseId}/extract

  ExtractLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ExtractFunction}"
      RetentionInDays: 14

  # ------------------------------------------------------------------
  # Lambda: POST /cases/{caseId}/plan -> deadlines, steps, call script
  # ------------------------------------------------------------------
  PlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: handlers.plan.lambda_handler
      Timeout: 5
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt CasesTable.Arn
      Events:
        Plan:
          Type: HttpApi
          Properties:
            ApiId: !Ref ThaamApi
            Method: POST
            Path: /cases/{caseId}/plan

  PlanLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PlanFunction}"
      RetentionInDays: 14

  # ------------------------------------------------------------------
  # Lambda: GET /cases/{caseId}/audio -> Polly speech of the call script
  # ------------------------------------------------------------------
  AudioFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: handlers.audio.lambda_handler
      Timeout: 15
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt CasesTable.Arn
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "${EvidenceBucket.Arn}/packs/*"
      Events:
        Audio:
          Type: HttpApi
          Properties:
            ApiId: !Ref ThaamApi
            Method: GET
            Path: /cases/{caseId}/audio

  AudioLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AudioFunction}"
      RetentionInDays: 14

Outputs:
  EvidenceBucketName:
    Description: S3 bucket for screenshots and case packs
    Value: !Ref EvidenceBucket
  CasesTableName:
    Description: DynamoDB table for cases
    Value: !Ref CasesTable
  ApiUrl:
    Description: Base URL of the Thaam HTTP API
    Value: !Sub "https://${ThaamApi}.execute-api.${AWS::Region}.amazonaws.com"
